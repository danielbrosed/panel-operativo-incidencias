name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP ${{ matrix.php }} · MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: incidents_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # >= 2.37.1 (CVE-2026-46420), pinned by commit.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, intl
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate composer.json and the lock file
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Create .env from the example
        run: cp .env.example .env && php artisan key:generate
      - name: Install Node dependencies
        run: npm ci
      - name: Build the frontend
        run: npm run build

      # The same checks as `composer check`, one step each so a failure names its tool.
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Frontend types, lint and format
        if: matrix.php == '8.4'
        run: npm run types && npm run lint && npm run format:check

      - name: Tests
        run: php artisan test

      - name: Smoke test · migrate, seed and run the diagnostic as the README describes
        env:
          DB_DATABASE: incidents
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE incidents CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php artisan migrate:fresh --seed --force
          code=0; php artisan incidents:diagnose || code=$?
          [ "$code" -eq 1 ] || { echo "::error::the dry run must find the seeded inconsistencies (exit 1), got $code"; exit 1; }
          php artisan incidents:diagnose --fix --force
          php artisan incidents:diagnose

  frontend:
    name: Frontend build · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          # The minimum in package.json "engines" and the README.
          - os: ubuntu-latest
            node: '22.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Type check
        run: npm run types
      - name: Build the frontend
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Audit PHP dependencies
        run: composer audit --locked --abandoned=report
      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate
